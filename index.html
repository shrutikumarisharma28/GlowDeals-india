    <style>
        :root {
            --muted-butter: #F9F6E5;
            --digital-lavender: #B6B1DF;
            --cyber-lime: #D2E76E;
            --deep-slate: #12131A;
            --pure-white: #FFFFFF;
        }

        body {
            background-color: var(--muted-butter);
            color: var(--deep-slate);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 0;
        }

        .bg-lavender { background-color: var(--digital-lavender); }
        .bg-butter { background-color: var(--muted-butter); }
        .bg-lime { background-color: var(--cyber-lime); }
        .text-slate { color: var(--deep-slate); }
        .border-slate { border-color: var(--deep-slate); }

        .btn-lime {
            background-color: var(--cyber-lime);
            color: var(--deep-slate);
            font-weight: 800;
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            border: 2px solid var(--deep-slate);
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px var(--deep-slate);
            cursor: pointer;
        }

        .btn-lime:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--deep-slate);
        }

        .btn-lavender {
            background-color: var(--digital-lavender);
            color: var(--deep-slate);
            font-weight: 700;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1.5px solid var(--deep-slate);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .card-container {
            background-color: var(--pure-white);
            border: 2px solid var(--deep-slate);
            border-radius: 1rem;
            box-shadow: 3px 3px 0px var(--deep-slate);
        }

        .badge-discount {
            background-color: var(--cyber-lime);
            color: var(--deep-slate);
            border: 1.5px solid var(--deep-slate);
            font-weight: 900;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
        }

        .tab-btn {
            border: 1.5px solid var(--deep-slate);
            font-weight: 700;
            border-radius: 9999px;
            padding: 0.4rem 1rem;
            background-color: var(--pure-white);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: var(--cyber-lime);
            box-shadow: 2px 2px 0px var(--deep-slate);
        }
    </style>
</head>

            const root = document.getElementById('portal-root');
            if (currentPortal === 'customer') renderCustomerPortal(root);
            else if (currentPortal === 'retailer') renderRetailerPortal(root);

                    btn.className = "text-xs font-bold px-4 py-1.5 rounded-full hover:bg-lavender";
                }
            });
        }

            currentPortal = portal;
            renderPortal();
        }

                            </label>
                        </div>

                        <button type="submit" class="btn-lime w-full text-sm mt-4 py-3">PAY & CONFIRM ORDER (₹${selectedProductForCheckout.deal}) ↗</button>
                    </form>
                </div>
            `;

            modal.classList.remove('hidden');
        }

        function processOrder(e) {
            e.preventDefault();
            const orderId = 'GLOW-' + Math.floor(100000 + Math.random() * 900000);
            const content = document.getElementById('checkout-content');

            content.innerHTML = `
                <div class="space-y-4 text-center py-2">
                    <div class="w-12 h-12 bg-lime border-2 border-slate rounded-full flex items-center justify-center text-2xl mx-auto">🎉</div>
                    <h2 class="text-xl font-black">Order Confirmed!</h2>
                    <p class="text-xs font-bold">Tracking ID: <span class="bg-lavender px-2 py-0.5 rounded border border-slate font-mono">${orderId}</span></p>

                    <div class="p-4 bg-white border-2 border-slate rounded-lg text-left text-xs space-y-2">
                        <p class="font-black text-sm border-b border-slate pb-1">Delivery Tracking Details</p>
                        <div class="flex justify-between font-bold text-green-700">
                            <span>Status:</span>
                            <span>Order Confirmed & Dispatch Pending</span>
                        </div>
                        <div class="flex justify-between font-bold">
                            <span>Estimated Delivery:</span>
                            <span>Within 3-5 Business Days</span>
                        </div>
                        <div class="flex justify-between font-bold">
                            <span>Item:</span>
                            <span>${selectedProductForCheckout.brand} - ${selectedProductForCheckout.name}</span>
                        </div>
                    </div>

                    <div class="p-3 bg-lavender border border-slate rounded-lg text-xs font-bold space-y-1">
                        <div class="flex justify-between text-[10px] uppercase font-black">
                            <span class="text-green-800">● Confirmed</span>
                            <span>○ Dispatched</span>
                            <span>○ Out for Delivery</span>
                        </div>
                        <div class="w-full bg-white h-2 rounded-full border border-slate overflow-hidden">
                            <div class="bg-lime h-full w-1/3 border-r border-slate"></div>
                        </div>
                    </div>

                    <button onclick="closeCheckout()" class="btn-lime w-full text-xs mt-2">BACK TO PRODUCTS</button>
                </div>
            `;
        }

        function closeCheckout() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function toggleSupportModal() {
            const modal = document.getElementById('support-modal');
            modal.classList.toggle('hidden');
        }

        function handleSupportSend(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const messages = document.getElementById('chat-messages');

            if (!input.value.trim()) return;

            const userMsg = document.createElement('div');
            userMsg.className = "p-2 bg-lime rounded-lg border border-slate max-w-[80%] ml-auto font-bold text-right";
            userMsg.innerText = input.value;
            messages.appendChild(userMsg);

            const userText = input.value;
            input.value = '';
            messages.scrollTop = messages.scrollHeight;

            setTimeout(() => {
                const botMsg = document.createElement('div');
                botMsg.className = "p-2 bg-lavender rounded-lg border border-slate max-w-[80%] font-bold";
                botMsg.innerText = `Thanks for reaching out regarding "${userText}". Our support ticket #TK-${Math.floor(1000+Math.random()*9000)} has been generated. A representative will respond shortly!`;
                messages.appendChild(botMsg);
                messages.scrollTop = messages.scrollHeight;
            }, 800);
        }

        function setCategory(cat) {
            selectedCategory = cat;
            renderPortal();
        }

        function filterProducts() {
            if (currentPortal === 'customer') renderPortal();
        }

        function runQuiz() {
            const output = document.getElementById('quiz-output');
            output.innerHTML = `<span class="bg-lime px-2 py-1 rounded border border-slate inline-block">✅ Recommended: Look for Salicylic Acid, Niacinamide, & Oil-Free Sunscreens</span>`;
        }

        function analyzeIngredients() {
            const input = document.getElementById('inci-input').value.toLowerCase();
            const output = document.getElementById('inci-output');

            if (!input.trim()) {
                output.innerHTML = `<span class="text-red-600">Please paste an ingredient list first.</span>`;
                return;
            }

            if (input.includes('coconut oil') || input.includes('isopropyl myristate') || input.includes('lanolin')) {
                output.innerHTML = `<div class="p-2 bg-red-100 border border-red-500 rounded text-red-800">⚠️ <strong>High Comedogenic Warning:</strong> Contains ingredients known to clog pores on oily skin.</div>`;
            } else {
                output.innerHTML = `<div class="p-2 bg-green-100 border border-green-700 rounded text-green-900">✅ <strong>Safe Profile Detected:</strong> Clean formulation with minimal comedogenic risk.</div>`;
            }
        }

        function renderRetailerPortal(container) {
            const gross = 25000;
            const comm = gross * 0.10;
            const net = gross - comm;

            container.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 space-y-6">
                        <div class="card-container p-6 bg-lavender">
                            <h2 class="font-black text-lg mb-2">Partner Onboarding Hub</h2>
                            <p class="text-xs font-bold mb-4">Choose your registration type to start listing deals or consulting customers.</p>

                            <div class="flex gap-2 mb-4">
                                <button onclick="setRetailerTab('brand')" class="btn-lime text-xs flex-1 ${currentRetailerTab === 'brand' ? '' : 'opacity-50'}">BRAND / RETAILER</button>
                                <button onclick="setRetailerTab('derm')" class="btn-lime text-xs flex-1 ${currentRetailerTab === 'derm' ? '' : 'opacity-50'}">DERMATOLOGIST</button>
                            </div>

                            <form onsubmit="event.preventDefault(); alert('Partner application submitted for admin governance verification!');" class="space-y-3">
                                <div>
                                    <label class="text-xs font-bold block mb-1">${currentRetailerTab === 'brand' ? 'Brand / Business Name:' : 'Doctor / Practice Name:'}</label>
                                    <input type="text" required placeholder="${currentRetailerTab === 'brand' ? 'e.g., Minimalist' : 'e.g., Dr. Ananya Sharma'}" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                </div>
                                <div>
                                    <label class="text-xs font-bold block mb-1">Official Contact Email:</label>
                                    <input type="email" required placeholder="official@partner.com" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                </div>
                                ${currentRetailerTab === 'derm' ? `
                                    <div>
                                        <label class="text-xs font-bold block mb-1">Medical Council Reg Number:</label>
                                        <input type="text" required placeholder="e.g., MCI-2026-XXXXX" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                    </div>
                                ` : ''}
                                <button type="submit" class="btn-lime w-full text-xs mt-2">SUBMIT FOR VERIFICATION ↗</button>
                            </form>
                        </div>
                    </div>

                    <div class="lg:col-span-2 space-y-6">
                        <div class="card-container p-6">
                            <h2 class="font-black text-2xl mb-2">Transparent Partner Revenue Model</h2>
                            <p class="text-xs font-bold mb-6">GlowDeals India operates on a strict zero upfront/subscription fee policy. We charge a flat 10% commission only on successfully fulfilled orders.</p>

                            <div class="card-container p-6 bg-butter border-2 border-slate max-w-xl mx-auto">
                                <h3 class="font-black text-base border-b-2 border-slate pb-2 mb-4 text-center">Monthly Payout Breakdown Example</h3>
                                <div class="space-y-3 text-xs font-bold">
                                    <div class="flex justify-between">
                                        <span>Gross Monthly Fulfilled Sales:</span>
                                        <span class="font-black">₹${gross.toLocaleString()}</span>
                                    </div>
                                    <div class="flex justify-between text-red-700">
                                        <span>GlowDeals Commission (10%):</span>
                                        <span class="font-black">- ₹${comm.toLocaleString()}</span>
                                    </div>
                                    <div class="flex justify-between text-green-700">
                                        <span>Upfront / Subscription Platform Fees:</span>
                                        <span class="font-black">₹0.00 (FREE)</span>
                                    </div>
                                    <div class="border-t-2 border-slate pt-3 flex justify-between text-sm font-black bg-lime p-3 rounded-lg border border-slate">
                                        <span>NET PARTNER PAYOUT:</span>
                                        <span>₹${net.toLocaleString()}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function setRetailerTab(tab) {
            currentRetailerTab = tab;
            renderPortal();
        }

        function renderAdminPortal(container) {
            container.innerHTML = `
                <div class="space-y-8">
                    <div class="border-b-2 border-slate pb-4">
                        <h2 class="text-2xl font-black">Governance & Blacklist Engine</h2>
                        <p class="text-xs font-bold">Monitor malpractices, counterfeit alerts, and enforce immediate platform bans.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div class="card-container p-6 bg-lavender">
                            <h3 class="font-black text-base mb-4">Ban Entity / Blacklist Management</h3>
                            <form onsubmit="handleAdminBlacklist(event)" class="space-y-3">
                                <div>
                                    <label class="text-xs font-bold block mb-1">Entity Name (Brand / Derm):</label>
                                    <input type="text" id="admin-black-name" required placeholder="e.g., Unverified Brand Ltd" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                </div>
                                <div>
                                    <label class="text-xs font-bold block mb-1">Type:</label>
                                    <select id="admin-black-type" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                        <option value="Brand">Brand / Retailer</option>
                                        <option value="Dermatologist">Dermatologist</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs font-bold block mb-1">Reason for Blacklisting:</label>
                                    <input type="text" id="admin-black-reason" required placeholder="e.g., Misleading claims, counterfeit batch" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                </div>
                                <button type="submit" class="btn-lime w-full text-xs bg-red-400 text-slate">INSTANTLY BAN & BLACKLIST ENTITY</button>
                            </form>
                        </div>

                        <div class="card-container p-6">
                            <h3 class="font-black text-base mb-4">Active Blacklisted Entities (${blacklistedEntities.length})</h3>
                            <div class="space-y-3">
                                ${blacklistedEntities.map(e => `
                                    <div class="p-3 bg-red-50 border border-slate rounded-lg flex justify-between items-center text-xs">
                                        <div>
                                            <p class="font-black text-red-900">${e.name} <span class="text-[10px] bg-red-200 px-2 py-0.5 rounded border border-red-400">${e.type}</span></p>
                                            <p class="font-bold text-gray-700 mt-1">${e.reason}</p>
                                        </div>
                                        <button onclick="removeBlacklist(${e.id})" class="text-xs text-red-600 underline font-bold">Remove</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAdminBlacklist(e) {
            e.preventDefault();
            const name = document.getElementById('admin-black-name').value;
            const type = document.getElementById('admin-black-type').value;
            const reason = document.getElementById('admin-black-reason').value;

            blacklistedEntities.push({ id: Date.now(), name, type, reason, date: new Date().toISOString().split('T')[0] });
            renderPortal();
        }

        function removeBlacklist(id) {
            blacklistedEntities = blacklistedEntities.filter(e => e.id !== id);
            renderPortal();
        }

        window.onload = function() {
            renderPortal();
        };
    </script>
</body>
</html>
