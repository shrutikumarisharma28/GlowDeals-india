<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowDeals India - Complete Tripartite Platform Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --muted-butter: #F9F6E5;
            --digital-lavender: #B6B1DF;
            --cyber-lime: #D2E76E;
            --deep-slate: #12131A;
            --pure-white: #FFFFFF;
            --discount-red: #B71C1C;
        }

        body {
            background-color: var(--muted-butter);
            color: var(--deep-slate);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .bg-lavender { background-color: var(--digital-lavender); }
        .bg-butter { background-color: var(--muted-butter); }
        .bg-lime { background-color: var(--cyber-lime); }
        .text-slate { color: var(--deep-slate); }
        .border-slate { border-color: var(--deep-slate); }

        .btn-lime {
            background-color: var(--cyber-lime);
            color: var(--deep-slate);
            font-weight: 800;
            padding: 0.6rem 1.25rem;
            border-radius: 9999px;
            border: 2px solid var(--deep-slate);
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px var(--deep-slate);
        }

        .btn-lime:hover {
            transform: translateY(-2px);
            box-shadow: 4px 4px 0px var(--deep-slate);
        }

        .btn-lavender {
            background-color: var(--digital-lavender);
            color: var(--deep-slate);
            font-weight: 700;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1.5px solid var(--deep-slate);
            transition: all 0.2s ease;
        }

        .btn-lavender:hover {
            opacity: 0.9;
        }

        .card-container {
            background-color: var(--pure-white);
            border: 2px solid var(--deep-slate);
            border-radius: 1rem;
            box-shadow: 3px 3px 0px var(--deep-slate);
        }

        .badge-discount {
            background-color: var(--cyber-lime);
            color: var(--deep-slate);
            border: 1.5px solid var(--deep-slate);
            font-weight: 900;
            padding: 0.2rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
        }

        .tab-btn {
            border: 1.5px solid var(--deep-slate);
            font-weight: 700;
            border-radius: 9999px;
            padding: 0.4rem 1rem;
            background-color: var(--pure-white);
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--cyber-lime);
            box-shadow: 2px 2px 0px var(--deep-slate);
        }
    </style>
</head>

            const root = document.getElementById('portal-root');

            else if (currentPortal === 'retailer') renderRetailerPortal(root);
            else if (currentPortal === 'admin') renderAdminPortal(root);

                } else {
                    btn.className = "text-xs font-bold px-4 py-1.5 rounded-full hover:bg-lavender";
                }
            });
        }

        // Switch Portal Function
        function switchPortal(portal) {
            currentPortal = portal;
            renderPortal();
        }

                                        <!-- Product Image Banner -->

                                            <p class="text-xs line-through text-gray-500 font-bold">MRP ₹${p.mrp}</p>
                                            <p class="text-xl font-black">₹${p.deal}</p>

        function analyzeIngredients() {
            const input = document.getElementById('inci-input').value.toLowerCase();
            const output = document.getElementById('inci-output');

            if (!input.trim()) {
                output.innerHTML = `<span class="text-red-600">Please paste an ingredient list first.</span>`;

            if (input.includes('coconut oil') || input.includes('isopropyl myristate') || input.includes('lanolin')) {

                                        <span>Gross Monthly Fulfilled Sales:</span>

            container.innerHTML = `

                        <!-- Blacklist Form -->
                        <div class="card-container p-6 bg-lavender">
                            <h3 class="font-black text-base mb-4">Ban Entity / Blacklist Management</h3>
                            <form onsubmit="handleAdminBlacklist(event)" class="space-y-3">
                                <div>
                                    <label class="text-xs font-bold block mb-1">Entity Name (Brand / Derm):</label>
                                    <input type="text" id="admin-black-name" required placeholder="e.g., Unverified Brand Ltd" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                </div>
                                <div>
                                    <label class="text-xs font-bold block mb-1">Type:</label>
                                    <select id="admin-black-type" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                        <option value="Brand">Brand / Retailer</option>
                                        <option value="Dermatologist">Dermatologist</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs font-bold block mb-1">Reason for Blacklisting:</label>
                                    <input type="text" id="admin-black-reason" required placeholder="e.g., Misleading ingredient claims, counterfeit batch" class="w-full p-2 border border-slate rounded-lg text-xs bg-butter">
                                </div>
                                <button type="submit" class="btn-lime w-full text-xs bg-red-400 text-slate">INSTANTLY BAN & BLACKLIST ENTITY</button>
                            </form>
                        </div>

                        <!-- Active Blacklist Directory -->
                        <div class="card-container p-6">
                            <h3 class="font-black text-base mb-4">Active Blacklisted Entities (${blacklistedEntities.length})</h3>
                            <div class="space-y-3">
                                ${blacklistedEntities.map(e => `
                                    <div class="p-3 bg-red-50 border border-slate rounded-lg flex justify-between items-center text-xs">
                                        <div>
                                            <p class="font-black text-red-900">${e.name} <span class="text-[10px] bg-red-200 px-2 py-0.5 rounded border border-red-400">${e.type}</span></p>
                                            <p class="font-bold text-gray-700 mt-1">${e.reason}</p>
                                        </div>
                                        <button onclick="removeBlacklist(${e.id})" class="text-xs text-red-600 underline font-bold">Remove</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleAdminBlacklist(e) {
            e.preventDefault();
            const name = document.getElementById('admin-black-name').value;
            const type = document.getElementById('admin-black-type').value;
            const reason = document.getElementById('admin-black-reason').value;

            blacklistedEntities.push({
                id: Date.now(),
                name,
                type,
                reason,
                date: new Date().toISOString().split('T')[0]
            });

            renderPortal();
        }

        function removeBlacklist(id) {
            blacklistedEntities = blacklistedEntities.filter(e => e.id !== id);
            renderPortal();
        }

        // App Initialization
        window.onload = function() {
            renderPortal();
        };
    </script>
</body>
</html>
